name: Foundation CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: "false"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de
        with:
          version: stable

      - name: Activate locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm --version

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate production manifest and release baseline
        run: pnpm release:validate

      - name: Validate frozen bytecode and EIP-170 headroom
        run: pnpm closure:validate

      - name: Run P-01 arithmetic invariant regression
        run: pnpm exec hardhat test test/LeopoldVaultFoundation.ts --grep "preserves exact cap|rejects the high-width wrap vector"

      - name: Run contract gates
        run: pnpm check:contracts

      - name: Run frontend typecheck, lint, tests, and build
        run: pnpm check:frontend

      - name: Run keeper gates
        run: pnpm check:keeper

      - name: Audit production dependencies
        run: pnpm audit:prod
