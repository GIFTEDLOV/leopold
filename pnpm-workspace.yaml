packages:
  - "."
  - "frontend"
  - "keeper"
  - "packages/*"

allowBuilds:
  "@reown/appkit": true
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  secp256k1: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
  "@metamask/sdk@0.32.0": 0.33.1
  "@walletconnect/ethereum-provider@2.17.0": 2.23.2
  "axios@>=1.0.0 <1.18.0": 1.18.0
  bigint-buffer: workspace:*
  "bn.js@>=4.0.0 <4.12.3": 4.12.3
  "bn.js@>=5.0.0 <5.2.3": 5.2.3
  "lodash@>=4.0.0 <=4.17.23": 4.18.1
  "nanoid@<3.3.18": 3.3.18
  "picomatch@<2.3.2": 2.3.2
  "uuid@>=8.0.0 <11.1.1": 11.1.1
  ws: 8.21.0
